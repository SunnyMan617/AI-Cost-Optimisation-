services:
  postgres:
    image: postgres:16-alpine
    container_name: aigateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aigateway-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  privacy:
    build:
      context: ./services/privacy
    container_name: aigateway-privacy
    environment:
      PORT: ${PRIVACY_PORT}
    ports:
      - "${PRIVACY_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: aigateway-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./gateway/litellm_config.yaml:/app/config.yaml:ro
      - ./gateway/hooks:/app/hooks:ro
    ports:
      - "4000:4000"
    depends_on:
      privacy:
        condition: service_healthy

  api:
    build:
      context: ./services/api
    container_name: aigateway-api
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PRIVACY_URL: http://privacy:8000
      DEFAULT_MONTHLY_BUDGET_USD: ${DEFAULT_MONTHLY_BUDGET_USD}
      FAIL_CLOSED_DEFAULT: ${FAIL_CLOSED_DEFAULT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
      privacy:
        condition: service_healthy
    ports:
      - "${API_PORT}:3001"

  dashboard:
    build:
      context: ./apps/dashboard
    container_name: aigateway-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT}
    depends_on:
      - api
    ports:
      - "${DASHBOARD_PORT}:3000"

volumes:
  postgres_data:
  redis_data:
